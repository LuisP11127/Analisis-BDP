name: Prueba de fuentes de datos

# Ejecuta los conectores de la extensión contra las fuentes que responden
# desde los servidores de GitHub (Flashscore, FotMob, ESPN, Understat y
# Apuesta Total). Falla si alguna deja de devolver datos.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe-sources.yml
      - scripts/test-sources.mjs
      - scripts/debug-kmianko.js
      - extension/lib/**
      - extension/sources/**

permissions:
  contents: read

jobs:
  conectores:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probar conectores
        run: node scripts/test-sources.mjs

      - name: Depurar cuotas de Apuesta Total (temporal)
        if: always()
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium > /dev/null
          node scripts/debug-kmianko.js
