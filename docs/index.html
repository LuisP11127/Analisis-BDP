<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Análisis BDP</title>
  <meta name="description" content="Partidos de Sofascore, análisis estadístico y con red neuronal, y seguimiento de apuestas por nivel de confianza.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f5fbf'/%3E%3Cpath d='M16 44 28 30l9 8 12-16' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Análisis <b>BDP</b></div>
    <div class="date-nav">
      <button class="icon-btn" id="prev-day" aria-label="Día anterior">‹</button>
      <input type="date" id="date" aria-label="Fecha">
      <button class="icon-btn" id="next-day" aria-label="Día siguiente">›</button>
      <button class="btn small" id="today">Hoy</button>
    </div>
    <div class="actions">
      <span class="sel-count" id="sel-count">0 partidos marcados</span>
      <button class="btn primary" id="run-stats" disabled>Análisis estadístico</button>
      <button class="btn nn" id="run-nn" disabled>Análisis red neuronal</button>
      <button class="icon-btn" id="open-settings" aria-label="Ajustes" title="Ajustes">⚙</button>
    </div>
  </header>

  <nav class="tabs">
    <button data-tab="partidos" class="active">Partidos</button>
    <button data-tab="analisis">Análisis</button>
    <button data-tab="historial">Historial</button>
    <span class="status" id="ext-status"></span>
  </nav>

  <main>
    <section id="tab-partidos"></section>
    <section id="tab-analisis" hidden></section>
    <section id="tab-historial" hidden></section>
  </main>

  <dialog id="settings">
    <form class="form" method="dialog" id="settings-form">
      <h3>Ajustes del análisis</h3>
      <label>Confianza alta: probabilidad mínima (%)<input name="alta" type="number" min="50" max="99" step="1"></label>
      <label>Moderada-alta: probabilidad mínima (%)<input name="moderadaAlta" type="number" min="50" max="99" step="1"></label>
      <label>Moderada: probabilidad mínima (%)<input name="moderada" type="number" min="50" max="99" step="1"></label>
      <label>Cuota mínima de cada pick<input name="minOdds" type="number" min="1.01" max="3" step="0.01"></label>
      <label>Cuotas objetivo de las combinadas (separadas por coma)<input name="comboTargets" type="text"></label>
      <label>Combinadas: probabilidad mínima de cada selección (%)<input name="comboMinProb" type="number" min="50" max="99" step="1"></label>
      <label>Combinadas: máximo de selecciones<input name="comboMaxLegs" type="number" min="2" max="12" step="1"></label>
      <div class="row">
        <button class="btn" value="reset" type="submit">Valores por defecto</button>
        <button class="btn" value="cancel" type="submit">Cancelar</button>
        <button class="btn primary" value="save" type="submit">Guardar</button>
      </div>
    </form>
  </dialog>

  <div class="overlay" id="busy" hidden>
    <div class="box">
      <strong id="busy-title">Analizando…</strong>
      <div class="progress"><span id="busy-bar" style="width: 0%"></span></div>
      <span class="note" id="busy-text"></span>
    </div>
  </div>
  <div id="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
